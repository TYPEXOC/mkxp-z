name: Build legacy Ruby runtimes

on:
  workflow_dispatch:
    inputs:
      build_variant:
        description: Select Release, Debug, or both build variants.
        type: choice
        required: true
        default: release
        options:
          - release
          - debug
          - all
  push:
    branches:
      - ruby-legacy-runtimes
    paths:
      - .github/workflows/build-legacy-ruby.yml
      - meson.build
      - meson_options.txt
      - src/meson.build
      - binding/meson.build
      - binding/binding-mri.cpp
      - binding/bitmap-binding.cpp
      - binding/binding-util.h
      - binding/http-binding.cpp
      - src/main.cpp
      - scripts/preload/win32_wrap.rb
      - tools/build-legacy-ruby.sh
      - tools/ruby193-baseruby-compat.rb
      - tests/legacy-ruby-smoke.c

permissions:
  contents: read

jobs:
  select:
    name: Select build variants
    runs-on: ubuntu-latest
    outputs:
      ruby_matrix: ${{ steps.variants.outputs.ruby_matrix }}
      mkxp_matrix: ${{ steps.variants.outputs.mkxp_matrix }}
    steps:
      - id: variants
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_VARIANT: ${{ inputs.build_variant }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            selected=release
          else
            selected="${BUILD_VARIANT:-release}"
          fi

          ruby_release='{"include":[{"version":"1.8.7","variant":"release","source":"https://github.com/mkxp-z/ruby.git","ref":"ruby_1_8_7"},{"version":"1.9.3","variant":"release","source":"https://github.com/ruby/ruby.git","ref":"ruby_1_9_3"}]}'
          ruby_debug='{"include":[{"version":"1.8.7","variant":"debug","source":"https://github.com/mkxp-z/ruby.git","ref":"ruby_1_8_7"}]}'
          ruby_all='{"include":[{"version":"1.8.7","variant":"release","source":"https://github.com/mkxp-z/ruby.git","ref":"ruby_1_8_7"},{"version":"1.9.3","variant":"release","source":"https://github.com/ruby/ruby.git","ref":"ruby_1_9_3"},{"version":"1.8.7","variant":"debug","source":"https://github.com/mkxp-z/ruby.git","ref":"ruby_1_8_7"}]}'
          mkxp_release='{"include":[{"version":"1.8.7","variant":"release","runtime_variant":"release","buildtype":"release","strip":true},{"version":"1.9.3","variant":"release","runtime_variant":"release","buildtype":"release","strip":true}]}'
          mkxp_debug='{"include":[{"version":"1.8.7","variant":"debug","runtime_variant":"debug","buildtype":"debug","strip":false}]}'
          mkxp_all='{"include":[{"version":"1.8.7","variant":"release","runtime_variant":"release","buildtype":"release","strip":true},{"version":"1.9.3","variant":"release","runtime_variant":"release","buildtype":"release","strip":true},{"version":"1.8.7","variant":"debug","runtime_variant":"debug","buildtype":"debug","strip":false}]}'

          case "$selected" in
            release) ruby_matrix="$ruby_release"; mkxp_matrix="$mkxp_release" ;;
            debug) ruby_matrix="$ruby_debug"; mkxp_matrix="$mkxp_debug" ;;
            all) ruby_matrix="$ruby_all"; mkxp_matrix="$mkxp_all" ;;
            *) echo "Unsupported build variant: $selected" >&2; exit 1 ;;
          esac

          echo "ruby_matrix=$ruby_matrix" >> "$GITHUB_OUTPUT"
          echo "mkxp_matrix=$mkxp_matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Ruby ${{ matrix.version }} (Windows i686)
    needs: select
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.ruby_matrix) }}

    steps:
      - uses: actions/checkout@v7

      - name: Install MSYS2 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw32
          update: false
          install: >-
            autoconf
            bison
            curl
            diffutils
            git
            make
            mingw-w64-i686-gcc
            mingw-w64-i686-zlib
            mingw-w64-x86_64-ruby

      - name: Build Ruby runtime
        id: compile
        shell: msys2 {0}
        run: |
          set +e
          mkdir -p artifacts
          bash tools/build-legacy-ruby.sh \
            '${{ matrix.version }}' \
            '${{ matrix.source }}' \
            '${{ matrix.ref }}' \
            "$(pwd)/artifacts/ruby-${{ matrix.version }}-${{ matrix.variant }}" \
            '${{ matrix.variant }}' \
            > "$(pwd)/artifacts/ruby-${{ matrix.version }}-${{ matrix.variant }}-build.log" 2>&1
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          tail -n 100 "$(pwd)/artifacts/ruby-${{ matrix.version }}-${{ matrix.variant }}-build.log"
          exit 0

      - name: Upload runtime and build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ruby-${{ matrix.version }}-${{ matrix.variant }}-windows-i686
          path: artifacts/
          if-no-files-found: warn

      - name: Check build result
        if: always()
        shell: msys2 {0}
        run: |
          result='${{ steps.compile.outputs.exit_code }}'
          if [[ ! "$result" =~ ^[0-9]+$ ]]; then result=1; fi
          exit "$result"

  build-mkxp-z:
    name: mkxp-z with Ruby ${{ matrix.version }} (${{ matrix.variant }}, Windows i686)
    needs: [select, build]
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.mkxp_matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Download static Ruby runtime
        uses: actions/download-artifact@v8
        with:
          name: ruby-${{ matrix.version }}-${{ matrix.runtime_variant }}-windows-i686
          path: runtime-package

      - name: Install MSYS2 build tools
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw32
          update: false
          install: >-
            bison
            diffutils
            git
            make
            mingw-w64-i686-cmake
            mingw-w64-i686-gcc
            mingw-w64-i686-meson
            mingw-w64-i686-ninja
            mingw-w64-i686-pkgconf
            mingw-w64-i686-zlib

      - name: Configure, link, and smoke-test mkxp-z
        id: compile
        shell: msys2 {0}
        run: |
          set +e
          mkdir -p artifacts
          runtime_root="$(cygpath -m "$(pwd)/runtime-package/ruby-${{ matrix.version }}-${{ matrix.runtime_variant }}")"
          meson setup --prefix "$(pwd)/build/artifact" --buildtype '${{ matrix.buildtype }}' -Dstrip='${{ matrix.strip }}' \
            -Dgfx_backend=gl -Dangle=disabled \
            -Dmri_version='${{ matrix.version }}' \
            -Dmri_runtime_root="$runtime_root" \
            build > artifacts/mkxp-z-ruby-${{ matrix.version }}-${{ matrix.variant }}-build.log 2>&1
          result=$?
          if [ "$result" -eq 0 ]; then
            ninja -C build >> artifacts/mkxp-z-ruby-${{ matrix.version }}-${{ matrix.variant }}-build.log 2>&1
            result=$?
          fi
          if [ "$result" -eq 0 ]; then
            meson install -C build --no-rebuild --tags mkxp-z >> artifacts/mkxp-z-ruby-${{ matrix.version }}-${{ matrix.variant }}-build.log 2>&1
            result=$?
          fi
          if [ "$result" -eq 0 ]; then
            runtime_lib="$runtime_root/lib"
            runtime_include="$runtime_root/include"
            ruby_compat_flags=''
            extra_libs='-lshell32 -lpthread -lz'
            if [ '${{ matrix.version }}' = '1.8.7' ]; then
              runtime_archive="$runtime_lib/libruby18.a"
              runtime_stdlib_dir="$runtime_root/stdlib/lib/ruby/1.8"
              ruby_compat_flags='-DLEGACY_RUBY_18'
              extra_libs="$extra_libs -lwsock32"
            else
              runtime_archive="$runtime_lib/libmsvcrt-ruby191-static.a"
              runtime_stdlib_dir="$runtime_root/stdlib/lib/ruby/1.9.1"
              extra_libs="$extra_libs -lws2_32 -limagehlp -lshlwapi"
            fi
            cc $ruby_compat_flags -idirafter "$runtime_include" tests/legacy-ruby-smoke.c "$runtime_archive" \
              $extra_libs -o build/artifact/legacy-ruby-smoke.exe \
              >> artifacts/mkxp-z-ruby-${{ matrix.version }}-${{ matrix.variant }}-build.log 2>&1
            result=$?
          fi
          if [ "$result" -eq 0 ]; then
            (cd build/artifact && ./legacy-ruby-smoke.exe '${{ matrix.version }}' "$runtime_stdlib_dir") \
              >> artifacts/mkxp-z-ruby-${{ matrix.version }}-${{ matrix.variant }}-build.log 2>&1
            result=$?
          fi
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          tail -n 100 artifacts/mkxp-z-ruby-${{ matrix.version }}-${{ matrix.variant }}-build.log
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mkxp-z-ruby-${{ matrix.version }}-${{ matrix.variant }}-build-log
          path: artifacts/*.log
          if-no-files-found: warn

      - name: Upload linked mkxp-z package
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v7
        with:
          name: mkxp-z-ruby-${{ matrix.version }}-${{ matrix.variant }}-windows-i686
          path: build/artifact/
          if-no-files-found: error

      - name: Check build result
        if: always()
        shell: msys2 {0}
        run: |
          result='${{ steps.compile.outputs.exit_code }}'
          if [[ ! "$result" =~ ^[0-9]+$ ]]; then result=1; fi
          exit "$result"
